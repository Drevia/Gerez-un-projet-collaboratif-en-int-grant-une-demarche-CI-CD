name: CI/CD Backend

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'back/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'back/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Nécessaire pour SonarCloud

    - name: Set up JDK 17
      uses: actions/setup-java@v
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Run tests with Maven
      working-directory: ./back
      run: mvn clean test

    - name: Generate JaCoCo report
      working-directory: ./back
      run: mvn jacoco:report

    - name: Upload coverage reports to SonarCloud
      working-directory: ./back
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        mvn -B sonar:sonar \
          -Dsonar.projectKey=bobapp-backend \
          -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
          -Dsonar.host.url=https://sonarcloud.io \
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}

    - name: Archive coverage reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: backend-coverage-reports
        path: back/target/site/jacoco/
        retention-days: 30

    - name: Comment PR with test results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: 'Backend tests passed and SonarCloud analysis completed!'
          })

